name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$SIGNING_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/iilami.jks"
      - name: Build signed release
        env:
          SIGNING_STORE: ${{ runner.temp }}/iilami.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Verify APK signature and package
        run: |
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          "$BT/aapt" dump badging app/build/outputs/apk/release/app-release.apk | head -5 | tee package.txt
          cp app/build/outputs/apk/release/app-release.apk iilami-1.0.0.apk
          sha256sum iilami-1.0.0.apk > SHA256SUMS.txt
      - name: Publish public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" iilami-1.0.0.apk SHA256SUMS.txt signature.txt package.txt --title "إعلامي 1.0.0" --notes "إصدار تجريبي عربي RTL. Android 7+. مصدر JSON عام، ربط البوت غير مفعّل. التحقق الدوري تقريبي كل 15 دقيقة وقد يؤخره النظام."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/iilami.jks"
