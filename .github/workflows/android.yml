name: Android APK
on:
  push:
    branches: [main]
    paths-ignore: ['feed/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$SIGNING_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/iilami.jks"
      - name: Build signed release
        env:
          SIGNING_STORE: ${{ runner.temp }}/iilami.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Verify signature, upgrade compatibility and package
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee signature.txt
          curl -fL --retry 2 https://github.com/Samir412005/comma-bulletin/releases/download/v1.1.0/iilami-1.1.0.apk -o previous.apk
          "$BT/apksigner" verify --print-certs previous.apk > previous-signature.txt
          diff <(grep 'certificate SHA-256 digest' previous-signature.txt) <(grep 'certificate SHA-256 digest' signature.txt)
          "$BT/aapt" dump badging app/build/outputs/apk/release/app-release.apk > package.txt
          grep "package: name='com.comma.bulletin' versionCode='5' versionName='1.2.0'" package.txt
          cp app/build/outputs/apk/release/app-release.apk iilami-1.2.0.apk
          test "$(stat -c%s iilami-1.2.0.apk)" -gt 2097152
          sha256sum iilami-1.2.0.apk > SHA256SUMS.txt
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 10 signed upgrade and UI smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: python3 scripts/smoke.py
      - name: Publish public APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.2.0"
          gh release create "$TAG" iilami-1.2.0.apk SHA256SUMS.txt signature.txt previous-signature.txt package.txt --target "$GITHUB_SHA" --title "v1.2.0" --notes "إعلامي 1.2.0: بحث فوري، تصنيفات، مفضلة محفوظة، وضع ليلي ونهاري، مشاركة ونسخ، جديد وغير المقروء، روابط وتواريخ نسبية، وتجربة Material 3 عربية مع العمل دون إنترنت. نفس توقيع 1.1.0 للتحديث مباشرة. Android 7+. قراءة GitHub أولاً مع احتياطي تلقائي؛ تحديث عند الفتح والعودة وكل 90 ثانية أثناء فتح التطبيق فقط بلا خدمة خلفية. العداد داخل التطبيق؛ شارة أيقونة المشغل تعتمد على النظام والإشعارات."
          curl -fIL --retry 2 "https://github.com/Samir412005/comma-bulletin/releases/download/$TAG/iilami-1.2.0.apk"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            app/build/reports/
            app/build/test-results/
            smoke.png
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/iilami.jks"
