name: Bootstrap encrypted signing secrets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Guard against accidental key rotation
        env:
          EXISTING: ${{ secrets.KEYSTORE_B64 }}
        run: test -z "$EXISTING"
      - run: python -m pip install PyNaCl==1.5.0
      - name: Generate private key and seal for repository secrets
        run: |
          python <<'PY'
          import os, json, base64, secrets, subprocess, pathlib
          from nacl.public import PublicKey, SealedBox
          key = PublicKey(base64.b64decode('pkHJk/LDpC0waa4DKJmDhHYdqfduqYIQtv9C82Jy9Fs='))
          box = SealedBox(key)
          password = secrets.token_urlsafe(48)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'private-iilami.jks'
          env = dict(os.environ, SIGNING_PASSWORD=password)
          subprocess.run(['keytool','-genkeypair','-keystore',str(path),'-storetype','PKCS12','-alias','iilami','-keyalg','RSA','-keysize','3072','-validity','10000','-dname','CN=Iilami, OU=Android, O=Iilami, C=DZ','-storepass:env','SIGNING_PASSWORD','-keypass:env','SIGNING_PASSWORD'],env=env,check=True)
          values = {'KEYSTORE_B64':base64.b64encode(path.read_bytes()).decode(), 'SIGNING_PASSWORD':password}
          sealed = {'key_id':'3380204578043523366','secrets':{k:base64.b64encode(box.encrypt(v.encode())).decode() for k,v in values.items()}}
          pathlib.Path('.signing').mkdir(exist_ok=True)
          pathlib.Path('.signing/bootstrap.sealed.json').write_text(json.dumps(sealed))
          path.unlink()
          PY
      - name: Save ciphertext only, never plaintext signing credentials
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .signing/bootstrap.sealed.json
          git commit -m 'Save sealed signing material for GitHub secret provisioning [skip ci]'
          git push
